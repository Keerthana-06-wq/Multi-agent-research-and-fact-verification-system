services:
  - type: web
    name: veritas-fact-verification
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
      - key: ENABLE_LLM_DOWNLOAD
        value: "false"
      - key: ENABLE_NLI_DOWNLOAD
        value: "false"
